name: CI - Main Branch Integration Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test & Build Release Artifacts
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Full Backend Test Suite
        env:
          NODE_ENV: test
          MONGODB_TEST_URI: mongodb://localhost:27017/agriconnect_main_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: agriconnect_ci_access_secret_key_test_2026
          JWT_REFRESH_SECRET: agriconnect_ci_refresh_secret_key_test_2026
        run: |
          cd backend
          npm test

      - name: Install Frontend Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./config/Dockerfile.backend
          push: false
          tags: agriconnect/backend:latest,agriconnect/backend:${{ github.sha }}

      - name: Build Production Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./config/Dockerfile.frontend
          push: false
          tags: agriconnect/frontend:latest,agriconnect/frontend:${{ github.sha }}

version: '3.8'

services:
  # ==========================================
  # Database: MongoDB Server
  # ==========================================
  mongodb:
    image: mongo:7-jammy
    container_name: agriconnect-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-agriadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-agripassword2026}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-agriconnect}
    volumes:
      - mongo-data:/data/db
    networks:
      - agriconnect-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # In-Memory Cache: Redis Server
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: agriconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword2026}
    volumes:
      - redis-data:/data
    networks:
      - agriconnect-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword2026}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Node.js/Express Backend API Service
  # ==========================================
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    container_name: agriconnect-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-agriadmin}:${MONGO_ROOT_PASSWORD:-agripassword2026}@mongodb:27017/${MONGO_INITDB_DATABASE:-agriconnect}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword2026}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-agriconnect_prod_access_secret_2026_prod_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-agriconnect_prod_refresh_secret_2026_prod_key}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agriconnect-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==========================================
  # React Frontend Web App (Nginx)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: agriconnect-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agriconnect-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health" ]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:
  redis-data:
  backend-uploads:

networks:
  agriconnect-network:
    driver: bridge
